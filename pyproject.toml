[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-mcp-agent"
version = "0.1.0"
description = "A governed AI agent over Jira via MCP: 4 autonomy stages, policy gates, human approval and audit trail"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]  # works with SDK 1.x (FastMCP) and 2.x (MCPServer)
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
